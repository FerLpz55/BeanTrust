name: Blockchain

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contracts:
    name: Contracts (Foundry + Slither)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Dependencias fijadas por SHA
        run: ./scripts/bootstrap-deps.sh
      - name: Formato
        run: forge fmt --check
      - name: Build
        run: forge build
      - name: Tests
        run: forge test -vvv
      - name: Cobertura
        run: forge coverage --report summary
      - name: Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/src
          fail-on: high

  anvil-e2e:
    name: Anvil E2E (backend + contrato real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Compilar contrato
        working-directory: contracts
        run: |
          ./scripts/bootstrap-deps.sh
          forge build
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Instalar dependencias
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff
      - name: E2E de anclaje con Anvil
        working-directory: Backend
        run: pytest tests/integration/test_anclaje_anvil.py -vv
