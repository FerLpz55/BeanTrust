name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx ruff
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests (pytest)
        run: pytest

  supabase:
    name: Supabase (migraciones + pgTAP + advisors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Arrancar Supabase local
        run: supabase start
      - name: Aplicar migraciones desde cero
        run: supabase db reset
      - name: Pruebas pgTAP (RLS, Storage, rate limit)
        run: supabase test db
      - name: Advisors (solo los ERROR tumban el CI)
        run: supabase db advisors --local --fail-on error

  mobile:
    name: Mobile (Node 24 · pnpm 11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      - name: Typecheck (tsc)
        run: pnpm exec tsc --noEmit
      - name: Lint (expo)
        run: pnpm exec expo lint --max-warnings=0
      - name: Tests (vitest)
        run: pnpm test

  edge:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Tests de la purga de evidencia
        run: deno test --allow-env --allow-net supabase/functions/purge-staged-evidence/index_test.ts
