# Configuración del proyecto Supabase de BeanTrust, aplicada con
#   supabase config push --project-ref yvczofwzfljuubxnmakj
#
# Solo se declara lo que el despliegue necesita fijar; el resto queda en los
# valores por defecto del proyecto.
project_id = "yvczofwzfljuubxnmakj"

[auth]
enabled = true
# Alta pública de productores habilitada: la 014 fuerza `productor` para toda
# alta (aunque la metadata pida otro rol) y el onboarding crea la primera finca
# con la cooperativa del piloto. Los roles privilegiados se siguen creando por
# procedimiento administrativo (Auth Admin), nunca desde la app.
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
# OJO: esto es el interruptor del *proveedor* de email. Ponerlo en false apaga
# también el login con correo (`email_provider_disabled`), no solo el alta. El
# cierre del registro va en `[auth] enable_signup`, arriba.
enable_signup = true
# Sin confirmación por correo: no hay dominio propio ni servidor SMTP.
enable_confirmations = false

# La purga de evidencia PENDIENTE se autentica con un secreto interno (lo envía
# el cron de la migración 007), no con un JWT de usuario. La propia función
# rechaza cualquier petición sin ese secreto.
[functions.purge-staged-evidence]
verify_jwt = false
